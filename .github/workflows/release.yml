name: release

# Publishing a GitHub Release promotes that tag to `latest`. This is the only
# thing that publishes to production, and the only thing CI publishes at all.
#
# Staging builds are cut from a maintainer's machine with `npm run
# release:staging`, which publishes under the `staging` tag. Merging to main
# does not publish: most merges are not a build anybody needs, and a channel
# that moves on every merge is one nobody can pin to.
on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # persist the exact released version to main before publishing
  id-token: write # OIDC for trusted publishing, and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Build from the tag, not from whatever main has drifted to since.
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1, which is newer than the npm
      # bundled with some Node releases. Upgrading here rather than trusting
      # the runner's default keeps the auth path from breaking silently.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      # The version commit is pushed back to main before npm publish. Requiring
      # the release tag to point at the current tip keeps that push
      # fast-forward-only and prevents a stale release from overwriting work.
      - name: Verify the release is from the tip of main
        run: |
          git fetch origin main:refs/remotes/origin/main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::release tag must point at the current tip of main"
            exit 1
          fi

      # The release tag is authoritative. This lets a maintainer create v1.2.0
      # without first making a version-only commit; npm updates both manifests
      # in the runner before anything is built or published.
      - name: Set package version from the release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "::error::refusing to publish prerelease version $VERSION to latest"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "release=$VERSION" >> "$GITHUB_OUTPUT"

      # The postinstall writes skills into ~/.claude and ~/.codex. It already
      # no-ops in a planx checkout, but being explicit means a change to that
      # guard can never quietly start mutating a release runner's home.
      - run: npm ci
        env:
          PLANX_NO_POSTINSTALL: '1'

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Persist exactly the version being released—never a guessed future
      # version. This happens before npm publish, so a failed push cannot leave
      # the registry ahead of the repository.
      - name: Commit the release version to main
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release }}
        run: |
          npm run docs:cli
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json site/reference/cli.md
          if git diff --cached --quiet; then
            echo "main already records $RELEASE_VERSION"
          else
            git commit -m "chore(release): v$RELEASE_VERSION"
            git push origin HEAD:main
          fi

      # No NODE_AUTH_TOKEN: trusted publishing exchanges the job's OIDC token
      # for a short-lived credential, and generates provenance on its own.
      # Scoped packages are private by default, so --access public is required.
      - name: Publish
        run: npm publish --tag latest --access public
