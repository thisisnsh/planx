name: release

# Publishing a GitHub Release promotes that tag to `latest`. This is the only
# thing that publishes to production, and the only thing CI publishes at all.
#
# Staging builds are cut from a maintainer's machine with `npm run
# release:staging`, which publishes under the `staging` tag. Merging to main
# does not publish: most merges are not a build anybody needs, and a channel
# that moves on every merge is one nobody can pin to.
on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC for trusted publishing, and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Build from the tag, not from whatever main has drifted to since.
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1, which is newer than the npm
      # bundled with some Node releases. Upgrading here rather than trusting
      # the runner's default keeps the auth path from breaking silently.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      # Fail loudly and early: publishing 1.2.0 from a tag called v1.3.0 would
      # be almost impossible to notice afterwards and impossible to undo.
      - name: Assert the tag matches package.json
        run: |
          TAG="${{ github.event.release.tag_name }}"
          PKG=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$PKG" ]; then
            echo "::error::release tag $TAG does not match package.json version $PKG"
            exit 1
          fi
          if [[ "$PKG" == *-* ]]; then
            echo "::error::refusing to publish prerelease version $PKG to latest"
            exit 1
          fi

      # The postinstall writes skills into ~/.claude and ~/.codex. It already
      # no-ops in a planx checkout, but being explicit means a change to that
      # guard can never quietly start mutating a release runner's home.
      - run: npm ci
        env:
          PLANX_NO_POSTINSTALL: '1'

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # No NODE_AUTH_TOKEN: trusted publishing exchanges the job's OIDC token
      # for a short-lived credential, and generates provenance on its own.
      # Scoped packages are private by default, so --access public is required.
      - name: Publish
        run: npm publish --tag latest --access public
