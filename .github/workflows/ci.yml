name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The postinstall runs `add-skills`, and stays quiet in a planx checkout
      # besides — but being explicit here means a change to either can never
      # quietly start mutating a CI runner's home.
      - run: npm ci
        env:
          PLANX_NO_POSTINSTALL: '1'

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
